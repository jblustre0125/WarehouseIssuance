plugins { id 'com.android.application' }

android {
    namespace 'com.nbcp.warehouse.tablet'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nbcp.warehouse.tablet'
        minSdk 26
        targetSdk 35
        versionCode 20001
        versionName '2.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

def tabletAssets = layout.buildDirectory.dir('generated/tablet-assets')
tasks.register('syncTabletPrintClient', Sync) {
    from("$rootDir/../assets/tablet-printer.js")
    into(tabletAssets)
}
android.sourceSets.main.assets.srcDir(tabletAssets)
tasks.named('preBuild').configure { dependsOn('syncTabletPrintClient') }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}
